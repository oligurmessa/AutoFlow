name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Tests use the fake backend, so the heavy GUI dependencies are skipped.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pyyaml pytest ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Validate example workflows
        run: python -m autoflow validate flows
